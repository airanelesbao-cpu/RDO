const DEF_DISC=[{n:'Elétrica',at:['Infraestrutura enterrada para alimentadores','Infraestrutura aparente para alimentadores','Infraestrutura enterrada para iluminação','Infraestrutura aparente de iluminação','Enfiação de cabos de distribuição','Enfiação de cabos alimentadores','Instalação de luminárias','Instalação de bombas','Instalação de painéis','Instalação de postes']},{n:'Hidráulica',at:['Rede de água de selagem','Rede de água industrial','Rede de água fria','Rede de esgoto','Rede de esgoto recalcado','Rede de percolado','Rede de água pluvial','Descidas pluviais']},{n:'Combate a Incêndio',at:['Solda PEAD','Solda PP','Instalação de rede PEAD','Instalação de aço carbono','Instalação de extintores','Instalação de caixas de incêndio','Instalação de válvulas angulares','Instalação de acessórios para hidrantes']},{n:'SDAI',at:['Infraestrutura aparente','Infraestrutura enterrada','Instalação de acionador','Enfiação de cabos de alarme','Instalação de central de alarme']},{n:'Sistemas de CFTV',at:['Infraestrutura aparente','Infraestrutura enterrada']}];

const parseLocal=s=>{const m=EMO.exec(s);return{i:'',n:(m&&m[2]?m[2]:s).trim()}};

function defCfg(){return{contratada:'',contratante:'',obra:'',obraCurta:'',inicio:todayStr(),prazo:365,prorrog:0,prefixo:'RDO_',emailCli:'',emailCoord:'',emailCcPdf:'',emailCcXlsx:'',logoSig:'',emailCco:'',emailAssunto:'RES: Diário de obra',sigNome:'',sigCargo:'',sigFone:'',sigEmail:'',sigSite:'',emailTxtCli:'Prezados,\n\nSegue em anexo o diário de obra n° {rdo} da {contratada}, referente a obra {obraCurta}.\n\nAtenciosamente,\n{usuario}',emailTxtCoord:'Olá,\n\nSegue em anexo o Excel do diário de obra n° {rdo} da {contratada}, referente a obra {obraCurta}.\n\nAtenciosamente,\n{usuario}',logoPot:'',logoCli:'',efetivoCat:[],equipCat:[],equipBase:{},roster:[],nextId:1,diretaId:'',lat:'',lon:'',cidade:'',carimbo:'',configurado:false,locais:[],disc:DEF_DISC.map(d=>({n:d.n,at:d.at.slice()}))};}

/* ============================================================
   Armazenamento local (IndexedDB), com reserva em memória
   ============================================================ */
const DB={db:null,mem:new Map(),
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('rdo-digital',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  get(k){if(!this.db)return Promise.resolve(this.mem.get(k));return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){if(!this.db){this.mem.set(k,v);return Promise.resolve(true)}return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})},
  clear(){this.mem.clear();if(!this.db)return Promise.resolve();return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=()=>res();t.onerror=()=>res();t.onabort=()=>res()}catch(e){res()}})},
  del(k){if(!this.db){this.mem.delete(k);return Promise.resolve(true)}return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})},
  keys(){if(!this.db)return Promise.resolve([...this.mem.keys()]);return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}};

function calc(cfg,day){

const fmtDT=t=>{try{return new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch(e){return''}};
const apInit=d=>{if(!d.aprov||typeof d.aprov!=='object')d.aprov={st:'',v:1,mot:'',hist:[]};if(!d.aprov.hist)d.aprov.hist=[];return d.aprov};
function apLog(ap,ev,x){ap.hist.push({t:Date.now(),by:(API.tok&&API.tok.nome)||'',ev,...(x||{})});if(ap.hist.length>60)ap.hist.splice(0,ap.hist.length-60)}
const effCfg=(cfg0,day)=>{const a=day&&day.aprov,cfg=day&&cfg0.roster.some(p=>p.desde&&p.desde>day.date)?{...cfg0,roster:cfg0.roster.filter(p=>!p.desde||p.desde<=day.date)}:cfg0;return a&&(a.st==='aprovado'||a.st==='cliente')&&a.logos?{...cfg,logoPot:a.logos.pot||'',logoCli:a.logos.cli||''}:cfg};
async function dayHash(d){try{
  const arr=[...dayShards(d,new Map()).entries()].filter(([k])=>!/\/apr$/.test(k)).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  if(!(window.crypto&&crypto.subtle))return'';
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(arr)));
  return[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return''}}
const fmtCod=h=>h?h.slice(0,32).replace(/(.{4})/g,'$1 ').trim():'';
async function apSyncFirst(){
  if(navigator.onLine===false)throw new Error('Sem internet. Conecte-se para enviar os dados e tente de novo.');
  await flush();await drain();
  if(S.day&&S.pend.has(S.day.date))throw new Error('Ainda há fotos ou alterações para enviar. Aguarde alguns segundos e tente de novo.')}
/* guarda no Drive as fotos do dia (aba Fotografias): 07. Fotos da obra / MM-AAAA / DD-MM-AAAA */
async function fotosDrive(dt){
  let salvas=0,total=0,falhas=0,pasta='',err='';
  try{for(let i=0;i<12;i++){
      const r=await API.req('/functions/v1/elaborar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'fotos-drive',data:dt})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||j.error||j.erro){err=j.erro||j.error||('erro '+r.status);break}
      if(j.config===false){S.apNote=null;paintApr();return}
      salvas+=j.salvas||0;falhas+=j.falhas||0;total=j.total||0;pasta=j.pasta||'';
      if(!j.restantes||(!j.salvas&&!j.falhas))break}}
  catch(e){err=String(e&&e.message||e)}
  if(S.day&&S.day.date!==dt){return}
  S.apNote=err?{bad:1,t:'Não consegui guardar as fotos no Drive: '+err}:total===0?{t:'Nenhuma foto neste dia para guardar no Drive.'}
    :{t:(salvas?salvas+(salvas===1?' foto guardada':' fotos guardadas'):'Fotos do dia já estavam')+' no Drive ('+pasta+')'+(falhas?'. '+falhas+' não puderam ser copiadas: tente enviar de novo.':'.')};
  paintApr()}
async function apDo(kind,motivo){
  const d=S.day;if(!d||S.apBusy)return;S.apBusy=1;S.apMsg=null;S.apNote=null;paintApr();
  try{const ap=apInit(d),nome=(API.tok&&API.tok.nome)||'';
    if(ap.st==='cliente')throw new Error('Este RDO já foi enviado ao cliente e está travado. Use "Destravar com senha".');
    if(kind==='send'){if(isVis())return;if(isDomDay(d)&&!d.dom)throw new Error('Domingo: responda se houve atividades de campo hoje.');if(!reportActs(d).length&&!domNao(d))throw new Error('Preencha pelo menos uma atividade antes de enviar.');
      await apSyncFirst();ap.st='enviado';ap.mot='';ap.env={by:nome,t:Date.now()};apLog(ap,'enviado')}
    else if(kind==='approve'){if(!canApprove())return;if(isDomDay(d)&&!d.dom)throw new Error('Domingo: responda se houve atividades de campo hoje.');await apSyncFirst();
      const hash=await dayHash(d);ap.st='aprovado';ap.mot='';ap.ap={by:nome,uid:API.tok.uid,t:Date.now(),hash,cod:fmtCod(hash)};

const EX_ATIV=['DDS: tema do dia de segurança;','Continuação da montagem da rede de incêndio do prédio administrativo;','Continuação da instalação de luminárias no galpão;','Continuação da montagem de infraestrutura de iluminação externa enterrada;','Marcação de vala para tubulação hidráulica;','Inicio da montagem da rede de água industrial da casa de bombas;'];

function elabPrompt(list,prev){
  const itens=JSON.stringify(list.map(a=>({id:a.id,local:a.local.trim(),disciplina:a.disciplina||'',servicos:a.servicos||[],fase:a.fase||'',complemento:a.bruto.trim()||((a.servicos||[]).length?'':a.tecnica.trim())})));
  return `Você redige o item "Descrição das atividades" do RDO (Relatório Diário de Obra) da obra "${S.cfg.obra}", contratada ${S.cfg.contratada.trim()}. Os encarregados de campo informam o local e o que foi feito em linguagem informal. Reescreva cada atividade em linguagem técnica de obra, no mesmo padrão dos exemplos reais deste relatório.

REGRAS
- Uma única frase curta, em forma nominal e sem sujeito, que começa por um substantivo de ação (Montagem, Instalação, Lançamento, Soldagem, Escavação, Execução, Marcação, Fabricação...).
- Inclua o local informado dentro da frase, de forma natural.
- Use "Continuação da/do..." quando a atividade claramente dá seguimento a uma atividade do dia anterior (lista abaixo). Use "Inicio da/do..." (grafia do modelo) quando o encarregado disser que começou hoje. Nos demais casos, escreva sem prefixo.
- Cada atividade traz "local" (nome do local da obra), "disciplina" (Elétrica, Hidráulica, Combate a Incêndio, SDAI ou Sistemas de CFTV), "servicos" (atividades marcadas pelo encarregado dentro dessa disciplina), "fase" ("inicio", "continuacao", "conclusao" ou vazio) e "complemento" (texto livre opcional). Use a disciplina para dar o contexto técnico correto (ex.: eletroduto/cabo na elétrica, tubulação na hidráulica), sem escrever o nome da disciplina como título. Una as atividades marcadas em uma única frase coerente, ligando com "e" ou vírgula, sem repetir o local. Use o complemento só para detalhar, sem inventar.
- Se "fase" for "continuacao", comece com "Continuação da/do..."; se for "inicio", comece com "Inicio da/do..." (grafia do modelo); se for "conclusao", comece com "Conclusão da/do...". Com "fase" vazia, siga a regra da lista do dia anterior.

function setLgTab(k){$('#lf').hidden=k!=='in';$('#cf').hidden=k==='in';$('#t-in').setAttribute('aria-selected',k==='in');$('#l-new').setAttribute('aria-selected',k!=='in')}
$('#t-in').addEventListener('click',()=>setLgTab('in'));$('#l-new').addEventListener('click',()=>setLgTab('new'));
document.querySelectorAll('#login .eye').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.for);const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Ocultar':'Mostrar'}));
$('#cf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#c-btn');b.disabled=true;$('#cmsg').textContent='Criando…';
  try{const email=$('#c-email').value.trim(),senha=$('#c-pw').value;
    const r=await fetch(CFGX.SUPABASE_URL+'/functions/v1/elaborar',{method:'POST',headers:{apikey:CFGX.SUPABASE_ANON_KEY,Authorization:'Bearer '+CFGX.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({acao:'criar-empresa',codigo:$('#c-cod').value.trim(),empresa:$('#c-emp').value.trim(),nome:$('#c-nome').value.trim(),email,senha})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){$('#cmsg').textContent=j.error||'Não foi possível criar a conta.';b.disabled=false;return}
    await API.login(email,senha);$('#c-pw').value='';setLgTab('in');await startApp()}
  catch(err){$('#cmsg').textContent='Sem conexão com a internet ou erro ao criar. Tente de novo.'}
  b.disabled=false});
let started=false;
async function startApp(){
  hideLogin();
  try{if(API.tok.emp)API.profile().catch(async e=>{if(e&&(e.status===401||e.status===403))await logout(e.status===403?e.msg:'')});else await API.profile()}catch(e){if(e&&(e.status===401||e.status===403)){await logout(e.status===403?e.msg:'');return}}
  {const emp=await DB.get('emp');if(emp!==undefined&&emp!==API.tok.emp){await DB.clear();S.cfg=defCfg();S.sCfg='';S.since={};S.seen={};S.synced=new Map();S.cfgKnown=false;S.days=[]}await DB.set('emp',API.tok.emp)}
  if(!tabOk(S.tab))S.tab='dia';
  S.pend=new Set((await DB.get('pend'))||[]);(await DB.keys()).filter(k=>String(k).startsWith('day:')).map(k=>String(k).slice(4)).sort().reverse().slice(0,7).forEach(x=>S.pend.add(x));
  await switchDay(todayStr());
  loadObras();
  if(!started){started=true;
    setTimeout(checkVer,1500);setInterval(checkVer,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkVer,1500)});
    setInterval(()=>{if(!document.hidden)tick()},4000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
    window.addEventListener('online',()=>tick());
    document.addEventListener('focusout',()=>setTimeout(()=>{if(!editing()){if(S.needPaint)paintSoon();tick()}},350));
    if('serviceWorker' in navigator&&!window.RDO_NATIVE)navigator.serviceWorker.register('sw.js').catch(()=>{})}
  window.__rdo={fotosDrive,capAuto,rdoDelete,actText,reportActs,domNao,drain,S,DB,API,calc,buildPages,composeAll,makePdf,makeXlsx,switchDay,paint,migrate,tick,dayShards}}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.tipo==='nova-versao'){S.novaVer=true;try{paintSync()}catch(e){}autoUpd()}});
async function applyUpdate(){try{await flush()}catch(e){}try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}location.reload()}
function autoUpd(){try{if(!S.novaVer||S.pend.size||S.busy)return;const t=(document.activeElement||{}).tagName||'';if(/INPUT|TEXTAREA|SELECT/.test(t))return;
  const n=+localStorage.getItem('rdo-auto')||0;if(Date.now()-n<300000)return;localStorage.setItem('rdo-auto',String(Date.now()));applyUpdate()}catch(e){}}
async function checkVer(){try{if(window.RDO_NATIVE||navigator.onLine===false)return;const r=await fetch('index.html?chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=/RDO_BUILD="(\d+)"/.exec(t);if(m&&m[1]!==String(window.RDO_BUILD)){S.novaVer=true;paintSync();autoUpd()}}catch(e){}}
(async function init(){
  await DB.open();API.load();
  const cfg=await DB.get('cfg');S.cfg=cfg?{...defCfg(),...cfg}:defCfg();S.sCfg=(await DB.get('scfg'))||'';
  if(!CFGX.SUPABASE_URL||!CFGX.SUPABASE_ANON_KEY){showLogin('Falta configurar o arquivo config.js (veja o LEIA-ME).');return}
  if(REC){if(REC.tok){showRecovery();return}showLogin(REC.err);return}
  if(!API.tok){showLogin('');return}
  await startApp();
})();
</script>
